# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 项目路径含非 ASCII 字符（逆向系老挂），关闭 AGP 路径检查
android.overridePathCheck=true
# 路径含中文，Kotlin 编译 daemon 必须用 UTF-8
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -Xmx1536m

# ---- 构建性能（待办 11） ----
# 配置缓存：跳过后面的配置阶段，增量构建收益最大。CI 与本地都开。
#
# 之所以能开：本工程的 build.gradle.kts 没有在配置期读环境变量以外的不确定状态；
# 唯一的例外是 `gitShortHash()`（providers.exec 调 git），它本身就是
# Provider API 的惰性求值，配置缓存可正确追踪。
org.gradle.configuration-cache=true
# 并行执行：多模块（app / 可能的 lib）并用。
org.gradle.parallel=true
# 构建缓存：跨 CI 运行复用任务输出（配合 actions/cache 的 gradle 缓存目录）。
org.gradle.caching=true

# CI/本地统一的 daemon 策略交给命令行 --no-daemon / --daemon 控制，
# 不在 properties 里写死（release.yml 需要常驻 daemon 才能吃到配置缓存热身）。

# ARM64 proot 环境 AAPT2 daemon 启动失败，改走单进程模式
android.aapt2.daemon.mode=none
