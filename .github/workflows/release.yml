name: Release

# 发布工作流：
# - 手动触发（workflow_dispatch）或推送 v* 标签触发
# - 从 version.properties 读版本号（versionName 即 3.141.1 这种）
# - 签名走 GitHub Secrets；未配置 secrets 时降级产出 unsigned APK（不签名）
#
# 签名 secrets 配置方法（仓库 Settings → Secrets and variables → Actions）：
#   1. KEYSTORE_BASE64   ：base64 编码的 keystore.jks（`base64 -w0 keystore.jks`）
#   2. KEYSTORE_PASSWORD ：keystore 密码
#   3. KEY_ALIAS         ：密钥别名
#   4. KEY_PASSWORD      ：密钥密码
# 配置齐 4 个 secret 后，本工作流会签出带签名的 release APK；
# 否则降级为 unsigned（与 ci.yml 同口径），保证工作流永不因缺 secret 而失败。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Read version
        id: version
        run: |
          VC=$(grep -oP '^versionCode=\K\d+' version.properties | head -1)
          VN=$(grep -oP '^versionName=\K.*' version.properties | head -1)
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "Version: $VN (code $VC)"

      # 签名准备必须在构建**之前**（2026-09-27 修正，待办 11）。
      #
      # 此前顺序是「先 build unsigned，再 setup signing，再 build signed」——
      # 同一份产物被 Gradle 跑了两遍。有 secrets 时第二遍其实会因 up-to-date
      # 而几乎瞬间返回，但没 secrets 时（当前仓库状态）第一遍仍是纯浪费；
      # 而且「键库在构建后才落盘」在语义上也不对——signingConfig 是在
      # 配置阶段就读 `../keystore.jks` 是否存在的。
      # 改成：先落 keystore，再一次性构建（有 secrets 就签，没有就 unsigned）。
      - name: Setup signing (from secrets)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "已从 secret 恢复 keystore.jks，将产出签名 APK"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "未配置 KEYSTORE_BASE64：release 将回落到 build.gradle.kts 里的 debug 签名兜底（APK 仍可安装，但签名身份是 Android Debug）"
          fi

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.name }}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "已用 keystore.jks 签名（signingConfig=release）"
          else
            echo "未配置签名，产出 unsigned APK"
          fi

      - name: Collect APKs + ABI check + mapping
        run: |
          set -euo pipefail
          mkdir -p dist/apk dist/mapping
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            echo "::group::$apk"
            echo "ABIs:"
            unzip -Z1 "$apk" 'lib/*/*.so' | cut -d/ -f2 | sort -u || true
            echo "::endgroup::"
            cp -v "$apk" dist/apk/
          done
          find app/build/outputs/mapping -name mapping.txt -print0 | while IFS= read -r -d '' m; do
            variantDir=$(basename "$(dirname "$m")")
            cp -v "$m" "dist/mapping/mapping-${variantDir}.txt"
          done || true
          echo "Collected APKs:"; ls -1 dist/apk
          echo "Collected mappings:"; ls -1 dist/mapping || echo "(none)"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: reverse-old-guy-release-${{ steps.version.outputs.name }}
          path: dist/apk/*.apk

      - name: Upload obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: obfuscation-mapping-${{ steps.version.outputs.name }}
          path: dist/mapping/*.txt
          if-no-files-found: warn

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/apk/*.apk --repo "$GITHUB_REPOSITORY" --title "${{ steps.version.outputs.name }}" --notes "release ${{ steps.version.outputs.name }} (auto-built)" --generate-notes || echo "release exists or create failed (non-fatal)"
