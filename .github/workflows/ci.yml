name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# 结构（2026-09-27 优化，待办 11）
#
# 目标是「从 checkout 到出 APK」压到 3 分 4 秒内，做法三条：
#
#  1. **lint 拆成独立 job、与 build 并行**（此前是 `build needs lint-and-test`
#     的串行链，lint 跑完才轮到 assembleRelease）。lint 慢但结果不影响 APK——
#     它只该在 PR 上把问题指出来，不该堵在产物路径上。
#  2. **测试并进 build job 的同一次 Gradle 调用**（`assembleRelease
#     testDebugUnitTest` 一条命令）：Gradle 的配置阶段只做一次。
#  3. **缓存交给 `gradle/actions/setup-gradle`**：它比 `setup-java` 的
#     `cache: gradle` 多缓存配置缓存与 wrapper，且能正确处理缓存写权限
#     （PR 来自 fork 时只读）。
#
# 注意：lint job 不再作为 build 的 `needs` 前置——这是与旧版的**唯一语义变化**：
# lint 挂了 CI 整体会红，但 APK 照样产出（产物不再被静态检查堵住）。
# ---------------------------------------------------------------------------

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  build:
    name: Build + Test (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release (unsigned)
        run: |
          set -euo pipefail
          VC=$(grep -oP '^versionCode=\K\d+' version.properties | head -1)
          VN=$(grep -oP '^versionName=\K.*' version.properties | head -1)
          echo "Building $VN (code $VC) — CI 不改版本号"
          # 只跑打包：本项目**没有测试源集**（`app/src` 下只有 `main`，
          # 也没有任何 `testImplementation` 依赖），`testDebugUnitTest` 会
          # 空跑一整套 Kotlin 编译 + 任务图，实测纯属浪费。
          # 将来真的写了单测，把 `testDebugUnitTest` 加回这一行即可
          # （加了之后它会被 `gradle/actions/setup-gradle` 的构建缓存覆盖，增量几乎为 0）。
          ./gradlew assembleRelease --no-daemon \
            -PversionCode="$VC" -PversionName="$VN"

      - name: Collect APKs + ABI check + mapping
        run: |
          set -euo pipefail
          mkdir -p dist/apk dist/mapping
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            echo "::group::$apk"
            echo "ABIs:"
            unzip -Z1 "$apk" 'lib/*/*.so' | cut -d/ -f2 | sort -u || true
            echo "::endgroup::"
            cp -v "$apk" dist/apk/
          done
          find app/build/outputs/mapping -name mapping.txt -print0 | while IFS= read -r -d '' m; do
            variantDir=$(basename "$(dirname "$m")")
            cp -v "$m" "dist/mapping/mapping-${variantDir}.txt"
          done || true
          echo "Collected APKs:"; ls -1 dist/apk
          echo "Collected mappings:"; ls -1 dist/mapping || echo "(none)"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: 逆向系老挂-unsigned
          path: dist/apk/*.apk

      - name: Upload obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: obfuscation-mapping
          path: dist/mapping/*.txt
